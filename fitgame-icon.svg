<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16346e"/>
      <stop offset="0.55" stop-color="#0a1736"/>
      <stop offset="1" stop-color="#050914"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0ff"/>
      <stop offset="0.5" stop-color="#2fa8ff"/>
      <stop offset="1" stop-color="#a77bff"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2fa8ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- grade holográfica -->
  <g stroke="#4cc3ff" stroke-opacity="0.07" stroke-width="2">
    <path d="M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512"/>
  </g>

  <!-- moldura hexagonal -->
  <polygon points="256,52 433,154 433,358 256,460 79,358 79,154" fill="none" stroke="url(#edge)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,86 404,171 404,341 256,426 108,341 108,171" fill="#071026" fill-opacity="0.55" stroke="#4cc3ff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- cantos de painel -->
  <g stroke="#7fe0ff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M44 92V44H92"/><path d="M468 420V468H420"/>
  </g>

  <!-- setas de level up -->
  <g fill="none" stroke="url(#up)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="186,214 256,150 326,214"/>
    <polyline points="186,274 256,210 326,274" stroke-opacity="0.6"/>
  </g>

  <!-- haltere -->
  <g filter="url(#soft)">
    <rect x="182" y="327" width="148" height="18" rx="9" fill="url(#metal)"/>
    <rect x="150" y="300" width="30" height="72" rx="9" fill="url(#metal)"/>
    <rect x="128" y="314" width="22" height="44" rx="7" fill="url(#metal)"/>
    <rect x="332" y="300" width="30" height="72" rx="9" fill="url(#metal)"/>
    <rect x="362" y="314" width="22" height="44" rx="7" fill="url(#metal)"/>
  </g>
</svg>
